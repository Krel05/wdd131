<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <link rel="stylesheet" href="styles/table.css">
</head>

<body>
    <table>
        <caption>Table 1: Account Feature Comparison</caption>
        <thead>
            <tr>
                <th colspan="4">ACME Wildwest Services</th>
            </tr>
            <tr>
                <th id="blank" colspan="1"></th>
                <th id="Basic" colspan="1">Basic</th>
                <th id="Premium" colspan="1">Premium</th>
                <th id="Deluxe" colspan="1">Deluxe</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td headers="blank">Feature 1</td>
                <td headers="Basic">✔️</td>
                <td headers="Premium">✔️</td>
                <td headers="Deluxe">✔️</td>
            </tr>
            <tr>
                <td headers="blank">Feature 2</td>
                <td headers="Basic">❌</td>
                <td headers="Premium">✔️</td>
                <td headers="Deluxe">✔️</td>
            </tr>
            <tr>
                <td headers="blank">Feature 3</td>
                <td headers="Basic">❌</td>
                <td headers="Premium">❌</td>
                <td headers="Deluxe">✔️</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
