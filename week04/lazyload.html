<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazyload</title>
    <meta name="description" content="webpage to learn lazyload using a lot of images">
    <meta name="author" content="Jorge Gabriel Mena Santes">
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>

<body>
    <main>
        <h1>Lazy Load</h1>
        <img src="../images/queretaro-wider.webp" alt="img 1" loading="lazy" width="400px" height="600px">
        <img src="../images/landscape-resized.webp" alt="img 2" loading="lazy" width="400px" height="600px">
        <img src="../images/profile.jpg" alt="img 3" loading="lazy" width="400px" height="600px">
        <img src="../images/queretaro-smaller.webp" alt="img 4" loading="lazy" width="400px" height="600px">
        <img src="../images/mexico-flag.webp" alt="img 5" loading="lazy" width="400px" height="600px">
        <img src="../images/cdmx-temple.jpg" alt="img 6" loading="lazy" width="400px" height="600px">
    </main>

    <footer>
        <p>This is just and example of footer</p>
        <p>Last modified <span id="lastModification"></span></p>
    </footer>
</body>

</html>
