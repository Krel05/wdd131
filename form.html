<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review form</title>
    <meta name="author" content="Jorge Gabriel Mena Santes">
    <meta name="description"
        content="A webpage to apply good form design principles. The purpose is to give a review of different products.">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Review Form</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <fieldset class="productName">
                <label for="selections">Product Name <select id="selections" name="products" required>
                        <option value="" disabled selected>Select a Product...</option>
                        <div id="products">
                        </div>
                    </select></label>
            </fieldset>

            <fieldset class="overallRating">

                <div>Overall Rating</div>
                <div class="rating">
                    <label for="one-star">&star;<input type="radio" id="one-star" name="rating" value="one"
                            required></label>
                    <label for="two-star">&star;&star;<input type="radio" id="two-star" name="rating" value="two"
                            required></label>
                    <label for="three-star">&star;&star;&star;<input type="radio" id="three-star" name="rating"
                            value="three" required></label>
                    <label for="four-star">&star;&star;&star;&star;<input type="radio" id="four-star" name="rating"
                            value="four" required></label>
                    <label for="five-star">&star;&star;&star;&star;&star;<input type="radio" id="five-star"
                            name="rating" value="five" required></label>
                </div>
            </fieldset>

            <fieldset class="date">
                <label for="installation">Date of Installation <input type="date" id="installation"
                        name="installationDate" required></label>
            </fieldset>
            <fieldset class="features">
                <div>Which features did you find useful in the product? (Check all that apply)</div>
                <label for="durability"><input type="checkbox" id="durability" name="durability" value="yes">
                    Durability</label>
                <label for="ease"><input type="checkbox" id="ease" name="easeUse" value="yes"> Ease of Use</label>
                <label for="performance"><input type="checkbox" id="performance" name="performance" value="yes">
                    Performance</label>
                <label for="design"><input type="checkbox" id="design" name="design" value="yes"> Design</label>
            </fieldset>

            <fieldset class="writtenReview">
                <label for="writtenReview">Written Review <textarea id="writtenReview"
                        name="writtenReview"></textarea></label>
            </fieldset>

            <fieldset class="userName">
                <label for="userName">User Name <input type="text" id="userName" name="userName"></label>

                <input type="submit" value="Send Review" class="button">
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> | Jorge Gabriel Mena Santes | Mexico</p>
        <p>Last modification: <span id="lm"></span></p>
    </footer>

</body>

</html>
